name: matchlab
description: MatchLab — футбольная аналитика и математическое прогнозирование.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  logger: ^2.6.1
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/matchlab_icon.png

flutter_launcher_icons:
  android: true
  image_path: assets/icon/matchlab_icon.png
  adaptive_icon_background: "#12141A"
  adaptive_icon_foreground: assets/icon/matchlab_icon.png
  adaptive_icon_foreground_inset: 16
